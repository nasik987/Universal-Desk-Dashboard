name: Build firmware and deploy web installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'UniversalDeskDashboard/**'
      - 'docs/**'
      - '.github/workflows/build-and-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.3

      - name: Install libraries
        run: |
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "TFT_eSPI"
          arduino-cli lib install "XPT2046_Touchscreen"
          arduino-cli lib install "ArduinoJson"

      - name: Configure TFT_eSPI for CYD 2USB
        run: |
          cp UniversalDeskDashboard/User_Setup_CYD2USB.h "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:jczn_2432s028r \
            --output-dir build \
            UniversalDeskDashboard

      - name: Install esptool
        run: pip install esptool

      - name: Create merged binary
        run: |
          BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -print -quit)"
          echo "Using boot_app0: $BOOT_APP0"
          test -n "$BOOT_APP0"
          mkdir -p docs/firmware
          SHORT_SHA="${GITHUB_SHA::8}"
          FW_FILE="UniversalDeskDashboard-${SHORT_SHA}.merged.bin"
          python -m esptool --chip esp32 merge-bin \
            -o "docs/firmware/${FW_FILE}" \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000 build/UniversalDeskDashboard.ino.bootloader.bin \
            0x8000 build/UniversalDeskDashboard.ino.partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 build/UniversalDeskDashboard.ino.bin

          python - <<'PY'
          import json, os
          sha = os.environ["GITHUB_SHA"][:8]
          run = os.environ["GITHUB_RUN_NUMBER"]
          manifest = {
              "name": "Universal Desk Dashboard",
              "version": f"0.2.{run}-{sha}",
              "home_assistant_domain": "universal_desk_dashboard",
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32",
                  "parts": [{
                      "path": f"firmware/UniversalDeskDashboard-{sha}.merged.bin",
                      "offset": 0
                  }]
              }]
          }
          with open("docs/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY
          cat docs/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
